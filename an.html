<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TailorEase — Premium Tailoring at Your Doorstep</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>

<!-- NAVIGATION (same as original) -->
<nav>
  <div class="nav-logo">TailorEase</div>
  <ul class="nav-links">
    <li><a href="#" onclick="showSection('home')">Home</a></li>
    <li><a href="#" onclick="showSection('services')">Services</a></li>
    <li><a href="#" onclick="showSection('booking')">Book Now</a></li>
    <li><a href="#" onclick="showSection('tracking')">Track Order</a></li>
    <li><a href="#" onclick="showSection('contact')">Contact</a></li>
  </ul>
  <a href="#" class="nav-cta" onclick="showSection('booking')">Book a Tailor →</a>
  <button class="nav-mobile-btn" onclick="toggleMobileMenu()">☰</button>
</nav>

<!-- ALL PAGE CONTENT (same structure as original) -->
<!-- ... (keep all HTML structure from original file) ... -->

<script>
// Backend API URL - Change this to your Flask server URL
const API_URL = 'http://localhost:5000/api';

// Show section function
function showSection(s) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + s).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // Refresh stats when showing home
  if (s === 'home') {
    loadStats();
  }
}

// Load statistics from backend
async function loadStats() {
  try {
    const response = await fetch(`${API_URL}/stats`);
    const data = await response.json();
    if (data.success) {
      const statElement = document.querySelector('.hero-stat-num');
      if (statElement && data.base_customers) {
        statElement.textContent = data.base_customers + '+';
      }
    }
  } catch (error) {
    console.log('Using offline stats');
  }
}

// Submit booking to backend
async function submitBooking(e) {
  e.preventDefault();
  
  // Collect form data
  const formData = {
    customer_name: document.querySelector('#page-booking input[placeholder="Priya Sharma"]').value,
    phone: document.querySelector('#page-booking input[placeholder="+91 98765 43210"]').value,
    email: document.querySelector('#page-booking input[placeholder="priya@email.com"]').value,
    city: document.querySelector('#page-booking select').value,
    address: document.querySelector('#page-booking input[placeholder="Flat No, Building Name, Street"]').value,
    garment_type: document.querySelector('#page-booking select[required]').value,
    service_type: document.querySelector('#page-booking .toggle-btn.selected')?.innerText || 'Both',
    preferred_date: document.querySelector('#page-booking input[type="date"]').value,
    time_slot: document.querySelector('#page-booking .slot.selected')?.innerText || '10:00 AM',
    special_instructions: document.querySelector('#page-booking textarea').value,
    payment_method: document.querySelectorAll('#page-booking .toggle-btn')[10]?.classList.contains('selected') ? 'UPI / Online' : 'Cash on Delivery'
  };
  
  // Validate required fields
  if (!formData.customer_name || !formData.phone || !formData.city || !formData.address || !formData.garment_type) {
    alert('Please fill all required fields');
    return;
  }
  
  try {
    // Show loading state
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerText;
    submitBtn.innerText = 'Processing...';
    submitBtn.disabled = true;
    
    // Send to backend
    const response = await fetch(`${API_URL}/bookings`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData)
    });
    
    const result = await response.json();
    
    if (result.success) {
      // Update modal with order ID
      document.querySelector('#booking-modal .modal-meta-val').textContent = result.order_id;
      document.getElementById('booking-modal').classList.add('open');
      e.target.reset();
      
      // Set default date
      const dateInput = document.querySelector('#page-booking input[type="date"]');
      if (dateInput) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
      }
    } else {
      alert('Booking failed: ' + result.error);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Unable to connect to server. Please check if the backend is running.');
  } finally {
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.innerText = originalText;
    submitBtn.disabled = false;
  }
}

// Track order from backend
async function trackOrder() {
  const orderId = document.getElementById('order-input').value.trim();
  if (!orderId) {
    alert('Please enter an Order ID');
    return;
  }
  
  try {
    const response = await fetch(`${API_URL}/bookings/${orderId}`);
    const data = await response.json();
    
    if (data.success) {
      // Update order display
      document.querySelector('#tracking-demo .order-num').textContent = orderId;
      document.querySelector('#tracking-demo .order-badge').textContent = data.order.status;
      
      // Build timeline
      const timelineContainer = document.querySelector('#tracking-demo .timeline');
      timelineContainer.innerHTML = '';
      
      data.timeline.forEach((item, index) => {
        const timelineItem = document.createElement('div');
        timelineItem.className = 'timeline-item';
        
        let dotClass = 'dot-pending';
        let icon = '○';
        if (item.done) {
          dotClass = 'dot-done';
          icon = '✓';
        } else if (item.active) {
          dotClass = 'dot-active';
          icon = '●';
        }
        
        const timeHtml = item.time ? `<div class="tl-time">${new Date(item.time).toLocaleString()}</div>` : '<div class="tl-time">Pending</div>';
        
        timelineItem.innerHTML = `
          <div class="tl-dot ${dotClass}">${icon}</div>
          ${index !== data.timeline.length - 1 ? '<div class="tl-line"></div>' : ''}
          <div class="tl-info">
            <div class="tl-label ${item.done ? 'done' : (item.active ? 'active' : '')}">${item.label}</div>
            ${timeHtml}
          </div>
        `;
        
        timelineContainer.appendChild(timelineItem);
      });
      
      document.getElementById('tracking-demo').scrollIntoView({ behavior: 'smooth' });
    } else {
      alert('Order not found: ' + data.error);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Unable to connect to server. Please check if the backend is running.');
  }
}

// Submit contact message
async function submitContact(e) {
  e.preventDefault();
  
  const formData = {
    name: e.target.querySelector('input[placeholder="Your name"]').value,
    phone: e.target.querySelector('input[placeholder="+91 ..."]').value,
    email: e.target.querySelector('input[placeholder="you@email.com"]').value,
    message: e.target.querySelector('textarea').value
  };
  
  try {
    const response = await fetch(`${API_URL}/contact`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData)
    });
    
    const result = await response.json();
    
    if (result.success) {
      const alert = document.getElementById('contact-alert');
      alert.style.display = 'flex';
      e.target.reset();
      setTimeout(() => alert.style.display = 'none', 5000);
    } else {
      alert('Failed to send message: ' + result.error);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Unable to connect to server. Please try again later.');
  }
}

// Helper functions
function toggleService(el) {
  el.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function selectSlot(el) {
  el.closest('.slot-grid').querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}

function closeModal() {
  document.getElementById('booking-modal').classList.remove('open');
}

function toggleMobileMenu() {
  const links = document.querySelector('.nav-links');
  if (links.style.display === 'flex') {
    links.style.display = '';
  } else {
    links.style.cssText = 'display:flex; flex-direction:column; position:absolute; top:72px; left:0; right:0; background:rgba(255,255,255,0.98); padding:1.5rem 5%; gap:1.2rem; z-index:999; border-bottom: 1px solid rgba(124,58,237,0.1); box-shadow:0 8px 24px rgba(124,58,237,0.08);';
  }
}

// Initialize date picker
const dateInput = document.querySelector('#page-booking input[type="date"]');
if (dateInput) {
  const today = new Date().toISOString().split('T')[0];
  dateInput.min = today;
  dateInput.value = today;
}

// Select first time slot by default
const firstSlot = document.querySelector('#page-booking .slot');
if (firstSlot) firstSlot.classList.add('selected');

// Load stats on page load
loadStats();
</script>
</body>
</html>
